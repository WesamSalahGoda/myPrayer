<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c5cc5">
<title>Prayer Widget</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: "Segoe UI", Tahoma;
    direction: rtl;
}

.date-box {
    margin-bottom: 15px;
    line-height: 1.6;
    text-align: center;
}

.day {
    font-size: 18px;
    font-weight: bold;
    color: #2c5cc5;
}

.dates-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 4px;
}

.hijri {
    font-size: 14px;
    color: #444;
}

.gregorian {
    font-size: 13px;
    color: #666;
}

.prayer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    padding: 6px 10px;
    border-radius: 8px;
    margin-bottom: 4px;
}

.prayer:not(.next) {
    border-bottom: 1px dashed #ddd;
}

.next {
    background: #e6f4ff;
    color: #0b5ed7;
    font-weight: bold;
}

.prayer-name {
    text-align: right;
}

.time {
    font-weight: bold;
    white-space: nowrap;
}

#countdownBox {
    margin-top: 10px;
    background: #f5f7ff;
    padding: 8px;
    border-radius: 10px;
    font-size: 15px;
    text-align: center;
    color: #1f3c88;
}
</style>

<script>
function to12HourArabic(time24) {
    const [hour, minute] = time24.split(':').map(Number);
    const period = hour >= 12 ? 'م' : 'ص';
    const hour12 = hour % 12 || 12;
    return `${hour12}:${minute.toString().padStart(2, '0')} ${period}`;
}

function getPrayerDate(time, addDay = 0) {
    const now = new Date();
    const [h, m] = time.split(':').map(Number);
    return new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate() + addDay,
        h, m, 0
    );
}

function renderPrayerData(data) {
    const timings = data.data.timings;
    const hijri = data.data.date.hijri;
    const gregorian = data.data.date.gregorian;

    document.getElementById('day').innerText = hijri.weekday.ar;
    document.getElementById('hijriDate').innerText =
        `${hijri.day} ${hijri.month.ar} ${hijri.year} هـ`;
    document.getElementById('gregorianDate').innerText =
        `${gregorian.day} / ${gregorian.month.number} / ${gregorian.year}`;

    const dhuhrName = hijri.weekday.ar === "الجمعة" ? "الجمعة" : "الظهر";
    document.getElementById('dhuhr-name').innerText = dhuhrName;

    const prayers = [
        { time: timings.Fajr, id: 'fajr' },
        { time: timings.Sunrise, id: 'sunrise' },
        { time: timings.Dhuhr, id: 'dhuhr' },
        { time: timings.Asr, id: 'asr' },
        { time: timings.Maghrib, id: 'maghrib' },
        { time: timings.Isha, id: 'isha' }
    ];

    prayers.forEach(p => {
        document.getElementById(p.id + '-time').innerText =
            to12HourArabic(p.time);
    });

    function updateCountdown() {
        const now = new Date();
        let nextIndex = -1;

        prayers.forEach((p, i) => {
            const prayerTime = getPrayerDate(p.time);
            document.getElementById(p.id).classList.remove('next');
            if (nextIndex === -1 && prayerTime > now) nextIndex = i;
        });

        if (nextIndex === -1) nextIndex = 0;

        const nextPrayer = prayers[nextIndex];
        const prayerDate =
            nextIndex === 0 && getPrayerDate(prayers[0].time) < now
            ? getPrayerDate(prayers[0].time, 1)
            : getPrayerDate(nextPrayer.time);

        document.getElementById(nextPrayer.id).classList.add('next');

        const diff = prayerDate - now;
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);

        document.getElementById('countdown').innerText =
            `${h} ساعة ${m} دقيقة ${s} ثانية`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
}

/* ===== Fetch with Offline Support ===== */
fetch('https://api.aladhan.com/v1/timingsByAddress?address=Cairo,Egypt')
.then(res => res.json())
.then(data => {
    localStorage.setItem("prayerData", JSON.stringify(data));
    renderPrayerData(data);
})
.catch(() => {
    const cached = localStorage.getItem("prayerData");
    if (cached) {
        renderPrayerData(JSON.parse(cached));
    } else {
        alert("لا يوجد اتصال بالإنترنت ولا بيانات محفوظة");
    }
});

/* ===== Service Worker ===== */
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>
</head>

<body>

<div class="date-box">
    <div class="day">مواقيت الصلاة ليوم <span id="day"></span></div>
    <div class="dates-container">
        <div class="hijri">📅 <span id="hijriDate"></span></div>
        <div class="gregorian">الموافق <span id="gregorianDate"></span> م</div>
    </div>
</div>

<div class="prayer" id="fajr">
    <span class="prayer-name">🌅 الفجر</span>
    <span class="time" id="fajr-time"></span>
</div>

<div class="prayer" id="sunrise">
    <span class="prayer-name">☀️ الشروق</span>
    <span class="time" id="sunrise-time"></span>
</div>

<div class="prayer" id="dhuhr">
    <span class="prayer-name">🕛 <span id="dhuhr-name"></span></span>
    <span class="time" id="dhuhr-time"></span>
</div>

<div class="prayer" id="asr">
    <span class="prayer-name">🕒 العصر</span>
    <span class="time" id="asr-time"></span>
</div>

<div class="prayer" id="maghrib">
    <span class="prayer-name">🌇 المغرب</span>
    <span class="time" id="maghrib-time"></span>
</div>

<div class="prayer" id="isha">
    <span class="prayer-name">🌙 العشاء</span>
    <span class="time" id="isha-time"></span>
</div>

<div id="countdownBox">
    متبقي: <strong id="countdown"></strong>
</div>

</body>
</html>
